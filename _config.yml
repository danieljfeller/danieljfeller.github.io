# Site settings
title: Daniel Feller, PhD
description: Director, Data Solutions at Rhino Federated Computing. Author of The Health Data Handbook, a free online guide to health data. PhD in Biomedical Informatics, Columbia University.
url: "https://danieljfeller.github.io"
baseurl: ""
author:
  name: Daniel Feller
  url: https://www.linkedin.com/in/daniel-feller-phd/
# Default social-share image (jekyll-seo-tag)
logo: /images/book/social-card.png

# About/contact
email: danieljfeller@gmail.com
github_username: danieljfeller
linkedin_username: daniel-feller-phd

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  # Every page gets the share card, so any link pasted into LinkedIn unfurls with an image.
  - scope:
      path: ""
    values:
      image: /images/book/social-card.png
  # Every page under book/ gets the book layout.
  - scope:
      path: "book"
    values:
      layout: book

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - convert_notebook.py
  - "book/*.docx"
  - "**/CLAUDE.md"
  - vendor
