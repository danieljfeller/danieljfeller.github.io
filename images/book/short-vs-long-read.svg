  <title>Short-read versus long-read sequencing over a repeat region</title>
  <desc>Two panels compare short and long sequencing reads tiling the same genome segment that contains two identical repeat copies. Short reads that fall entirely within a repeat cannot be placed uniquely; long reads span the repeat with unique flanking sequence and are anchored unambiguously. Illustrative schematic.</desc>
