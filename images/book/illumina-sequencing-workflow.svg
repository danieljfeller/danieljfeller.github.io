<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"
     role="img" text-rendering="geometricPrecision"
     font-family="'Inter', Arial, Helvetica, sans-serif">
  <title>Illumina sequencing workflow</title>
  <desc>Three stages of Illumina sequencing. a, Cluster generation: a single DNA
    fragment binds the flow cell, is amplified by bridge amplification, and forms
    a dense clonal cluster. b, Sequencing by synthesis: fluorescently labelled
    bases are added one cycle at a time and imaged, with each of the four bases
    read on its own channel. c, Demultiplexing and read mapping: raw BCL images
    are demultiplexed into FASTQ, quality-trimmed, and aligned to produce mapped
    reads. Illustrative schematic.</desc>

  <defs>
    <marker id="iwArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#59636e"/>
    </marker>
  </defs>

  <!-- ================= Panel a ================= -->
  <text x="24" y="34" font-size="15" font-weight="700" fill="#1f2328">a</text>
  <text x="44" y="34" font-size="13" font-weight="600" fill="#1f2328">Cluster generation</text>

  <!-- stage 1: fragment binds flow cell -->
  <rect x="60" y="50" width="220" height="96" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <line x1="80" y1="120" x2="260" y2="120" stroke="#59636e" stroke-width="1.5"/>
  <path d="M 165 120 L 165 96 L 178 88" fill="none" stroke="#0969da" stroke-width="1.75" stroke-linecap="round"/>
  <text x="170" y="164" text-anchor="middle" font-size="11" fill="#59636e">Fragment binds flow cell</text>

  <line x1="286" y1="98" x2="344" y2="98" stroke="#59636e" stroke-width="1.5" marker-end="url(#iwArrow)"/>

  <!-- stage 2: bridge amplification -->
  <rect x="350" y="50" width="220" height="96" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <line x1="370" y1="120" x2="550" y2="120" stroke="#59636e" stroke-width="1.5"/>
  <path d="M 395 120 A 22 22 0 0 1 439 120" fill="none" stroke="#0969da" stroke-width="1.75"/>
  <path d="M 455 120 A 26 26 0 0 1 507 120" fill="none" stroke="#0969da" stroke-width="1.75"/>
  <text x="460" y="164" text-anchor="middle" font-size="11" fill="#59636e">Bridge amplification</text>

  <line x1="576" y1="98" x2="634" y2="98" stroke="#59636e" stroke-width="1.5" marker-end="url(#iwArrow)"/>

  <!-- stage 3: clonal cluster -->
  <rect x="640" y="50" width="200" height="96" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <g fill="#0969da">
    <circle cx="720" cy="92" r="3"/><circle cx="732" cy="86" r="3"/><circle cx="744" cy="94" r="3"/>
    <circle cx="756" cy="86" r="3"/><circle cx="726" cy="100" r="3"/><circle cx="740" cy="104" r="3"/>
    <circle cx="752" cy="100" r="3"/><circle cx="764" cy="96" r="3"/><circle cx="734" cy="94" r="3"/>
    <circle cx="748" cy="88" r="3"/><circle cx="722" cy="82" r="3"/><circle cx="758" cy="106" r="3"/>
  </g>
  <text x="740" y="164" text-anchor="middle" font-size="11" fill="#59636e">Dense clonal cluster</text>

  <!-- ================= Panel b ================= -->
  <text x="24" y="216" font-size="15" font-weight="700" fill="#1f2328">b</text>
  <text x="44" y="216" font-size="13" font-weight="600" fill="#1f2328">Sequencing by synthesis</text>

  <!-- template strand -->
  <g stroke="#59636e" stroke-width="1.5">
    <line x1="150" y1="240" x2="150" y2="360"/>
    <line x1="162" y1="240" x2="162" y2="360"/>
  </g>
  <text x="156" y="378" text-anchor="middle" font-size="11" fill="#59636e">Template + primer</text>
  <!-- incorporated fluorescent bases (colored, climbing) -->
  <circle cx="156" cy="344" r="6" fill="#0969da"/>
  <circle cx="156" cy="328" r="6" fill="#d55e00"/>
  <circle cx="156" cy="312" r="6" fill="#009e73"/>
  <circle cx="156" cy="296" r="6" fill="#7d55c7"/>

  <!-- imaging -->
  <rect x="250" y="250" width="70" height="40" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
  <path d="M 275 290 L 295 290 L 285 306 z" fill="#59636e"/>
  <text x="285" y="274" text-anchor="middle" font-size="10" fill="#1f2328">Camera</text>
  <text x="285" y="326" text-anchor="middle" font-size="11" fill="#59636e">Image each cycle</text>
  <line x1="200" y1="300" x2="246" y2="290" stroke="#59636e" stroke-width="1.5" marker-end="url(#iwArrow)"/>

  <!-- 4-channel legend -->
  <text x="470" y="246" font-size="11" font-weight="600" fill="#1f2328">Each base = one fluorescence channel</text>
  <g font-size="12" fill="#1f2328">
    <circle cx="478" cy="270" r="6" fill="#0969da"/><text x="494" y="274">A — adenine</text>
    <circle cx="478" cy="292" r="6" fill="#d55e00"/><text x="494" y="296">C — cytosine</text>
    <circle cx="478" cy="314" r="6" fill="#009e73"/><text x="494" y="318">G — guanine</text>
    <circle cx="478" cy="336" r="6" fill="#7d55c7"/><text x="494" y="340">T — thymine</text>
  </g>
  <text x="640" y="290" font-size="11" fill="#59636e">Per-cycle base calls</text>
  <text x="640" y="310" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#1f2328">A C G T G C …</text>

  <!-- ================= Panel c ================= -->
  <text x="24" y="416" font-size="15" font-weight="700" fill="#1f2328">c</text>
  <text x="44" y="416" font-size="13" font-weight="600" fill="#1f2328">Demultiplexing &amp; read mapping</text>

  <!-- arrow labels -->
  <g font-size="10" fill="#59636e" text-anchor="middle">
    <text x="205" y="444">demultiplex</text>
    <text x="205" y="456">(bcl2fastq)</text>
    <text x="415" y="444">QC + trim</text>
    <text x="415" y="456">(FastQC, Trimmomatic)</text>
    <text x="650" y="444">align</text>
    <text x="650" y="456">(BWA / STAR)</text>
  </g>

  <!-- nodes -->
  <g font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">
    <rect x="40" y="464" width="120" height="50" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
    <text x="100" y="493">BCL images</text>
    <rect x="250" y="464" width="120" height="50" rx="4" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="310" y="493">FASTQ</text>
    <rect x="460" y="464" width="120" height="50" rx="4" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="520" y="493">Trimmed reads</text>
    <rect x="720" y="464" width="120" height="50" rx="4" fill="#009e73" fill-opacity="0.12" stroke="#009e73" stroke-width="1"/>
    <text x="780" y="493">Mapped reads</text>
  </g>
  <g stroke="#59636e" stroke-width="1.5">
    <line x1="163" y1="489" x2="247" y2="489" marker-end="url(#iwArrow)"/>
    <line x1="373" y1="489" x2="457" y2="489" marker-end="url(#iwArrow)"/>
    <line x1="583" y1="489" x2="717" y2="489" marker-end="url(#iwArrow)"/>
  </g>
</svg>
