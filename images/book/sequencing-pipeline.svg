<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200"
     role="img" text-rendering="geometricPrecision"
     font-family="'Inter', Arial, Helvetica, sans-serif">
  <title>Short-read sequencing bioinformatics pipeline</title>
  <desc>A left-to-right pipeline: raw BCL sequencer output is demultiplexed into
    per-sample FASTQ reads, aligned to a reference genome to produce BAM or CRAM,
    sorted and deduplicated, then variant-called into a VCF or gVCF containing
    SNVs, indels, CNVs, and structural variants.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#59636e"/>
    </marker>
  </defs>

  <!-- action labels (above arrows) -->
  <g font-size="11" fill="#59636e" text-anchor="middle">
    <text x="195" y="60">demultiplex</text>
    <text x="365" y="60">align to reference</text>
    <text x="535" y="60">sort · mark duplicates</text>
    <text x="705" y="60">call variants</text>
  </g>

  <!-- nodes -->
  <g font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">
    <!-- 1 · raw input (neutral tint) -->
    <rect x="45" y="70" width="130" height="60" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
    <text x="110" y="105">BCL</text>
    <!-- 2 · reads (blue) -->
    <rect x="215" y="70" width="130" height="60" rx="4" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="280" y="105">FASTQ</text>
    <!-- 3 · aligned (blue) -->
    <rect x="385" y="70" width="130" height="60" rx="4" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="450" y="105">BAM / CRAM</text>
    <!-- 4 · sorted (blue) -->
    <rect x="555" y="70" width="130" height="60" rx="4" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="620" y="105">Sorted BAM</text>
    <!-- 5 · variants (green output) -->
    <rect x="725" y="70" width="130" height="60" rx="4" fill="#009e73" fill-opacity="0.12" stroke="#009e73" stroke-width="1"/>
    <text x="790" y="105">VCF / gVCF</text>
  </g>

  <!-- arrows between nodes -->
  <g stroke="#59636e" stroke-width="1.5">
    <line x1="178" y1="100" x2="212" y2="100" marker-end="url(#arrow)"/>
    <line x1="348" y1="100" x2="382" y2="100" marker-end="url(#arrow)"/>
    <line x1="518" y1="100" x2="552" y2="100" marker-end="url(#arrow)"/>
    <line x1="688" y1="100" x2="722" y2="100" marker-end="url(#arrow)"/>
  </g>

  <!-- node descriptors (below) -->
  <g font-size="10" fill="#59636e" text-anchor="middle">
    <text x="110" y="150">raw sequencer output</text>
    <text x="280" y="150">per-sample reads</text>
    <text x="280" y="163">+ quality scores</text>
    <text x="450" y="150">reads mapped to</text>
    <text x="450" y="163">the reference genome</text>
    <text x="620" y="150">position-sorted,</text>
    <text x="620" y="163">deduplicated</text>
    <text x="790" y="150">SNVs · indels</text>
    <text x="790" y="163">CNVs · SVs</text>
  </g>
</svg>
