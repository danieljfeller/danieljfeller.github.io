<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"
     role="img" text-rendering="geometricPrecision"
     font-family="'Inter', Arial, Helvetica, sans-serif">
  <title>From unaligned reads to an aligned pileup</title>
  <desc>Left: a jumbled pile of short reads, drawn as bars carrying nucleotide letters, with no
    positions, as stored in a FASTQ file. Middle: an arrow labelled align to reference. Right:
    a reference genome drawn as a long bar with the same reads stacked beneath it at their
    mapped positions, overlapping to give depth, as stored in a SAM or BAM file. Illustrative.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#59636e"/>
    </marker>
  </defs>

  <!-- panel a: unaligned reads (FASTQ) -->
  <text x="24" y="40" font-size="15" font-weight="700" fill="#1f2328">a</text>
  <text x="44" y="40" font-size="13" font-weight="500" fill="#1f2328">FASTQ: reads with no position</text>
  <text x="44" y="56" font-size="11" fill="#59636e">a pile of puzzle pieces, in the order the sequencer produced them</text>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" fill="#1f2328">
    <rect x="52" y="84" width="96" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="58" y="96">TGCAGGATCCAT</text>
    <rect x="170" y="98" width="88" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="176" y="110">ATCCATGGAAC</text>
    <rect x="78" y="118" width="80" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="84" y="130">GGAACTTAGC</text>
    <rect x="196" y="134" width="96" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="202" y="146">GATTACAGATCG</text>
    <rect x="44" y="156" width="104" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="50" y="168">CAGATCGTGCAGG</text>
    <rect x="168" y="172" width="80" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="174" y="184">TTAGCCTGAA</text>
    <rect x="92" y="194" width="96" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="98" y="206">CCATGGAACTTA</text>
    <rect x="212" y="208" width="72" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="218" y="220">TCGTGCAGG</text>
    <rect x="60" y="230" width="88" height="16" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="66" y="242">GATCCATGGAA</text>
  </g>
  <text x="44" y="272" font-size="11" fill="#59636e">each read: sequence + per-base quality, no coordinates</text>

  <!-- arrow -->
  <line x1="318" y1="160" x2="392" y2="160" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="146" font-size="11" font-weight="500" fill="#1f2328" text-anchor="middle">align to</text>
  <text x="355" y="178" font-size="11" font-weight="500" fill="#1f2328" text-anchor="middle">reference</text>

  <!-- panel b: aligned pileup (SAM/BAM) -->
  <text x="420" y="40" font-size="15" font-weight="700" fill="#1f2328">b</text>
  <text x="440" y="40" font-size="13" font-weight="500" fill="#1f2328">SAM/BAM: the same reads placed on the reference</text>
  <text x="440" y="56" font-size="11" fill="#59636e">each read now has a chromosome, a position, and a mapping quality</text>

  <!-- reference genome -->
  <rect x="440" y="80" width="326" height="20" rx="3" fill="#1f2328" fill-opacity="0.08" stroke="#1f2328" stroke-width="1"/>
  <text x="448" y="94" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f2328">GATTACAGATCGTGCAGGATCCATGGAACTTAGCCTGAAGTCA</text>
  <text x="440" y="74" font-size="10" fill="#59636e">reference chr1: 15,589 →</text>

  <!-- aligned reads: x = 448 + 7.2 × offset on the reference -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f2328">
    <rect x="445.0" y="108" width="92.4" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="448.0" y="121">GATTACAGATCG</text>
    <rect x="531.4" y="108" width="92.4" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="534.4" y="121">TGCAGGATCCAT</text>
    <rect x="617.8" y="108" width="78.0" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="620.8" y="121">GGAACTTAGC</text>
    <rect x="481.0" y="130" width="99.6" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="484.0" y="143">CAGATCGTGCAGG</text>
    <rect x="574.6" y="130" width="85.2" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="577.6" y="143">ATCCATGGAAC</text>
    <rect x="653.8" y="130" width="78.0" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="656.8" y="143">TTAGCCTGAA</text>
    <rect x="509.8" y="152" width="70.8" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="512.8" y="165">TCGTGCAGG</text>
    <rect x="589.0" y="152" width="92.4" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="592.0" y="165">CCATGGAACTTA</text>
    <rect x="567.4" y="174" width="85.2" height="17" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1"/>
    <text x="570.4" y="187">GATCCATGGAA</text>
  </g>

  <!-- depth callout -->
  <g stroke="#d0d7de" stroke-width="0.75" fill="none">
    <path d="M 610.0 196 L 610.0 224"/>
  </g>
  <text x="610.0" y="240" font-size="11" fill="#59636e" text-anchor="middle">4 reads overlap here: sequencing depth 4×</text>
  <text x="610.0" y="256" font-size="11" fill="#59636e" text-anchor="middle">more overlapping reads → more confidence in a variant call</text>

  <!-- what a SAM row adds -->
  <text x="440" y="284" font-size="10" fill="#59636e" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">read_7  chr1  15589  MAPQ 60  12M  GATTACAGATCG  IIIIIIIIFFFF</text>
</svg>
