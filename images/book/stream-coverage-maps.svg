<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400"
     role="img" text-rendering="geometricPrecision"
     font-family="'Inter', Arial, Helvetica, sans-serif">
  <title>Which data streams capture which events, for two patients</title>
  <desc>Two grids side by side. Rows are data streams: medical claims, pharmacy claims, EHR,
    patient-reported outcomes, and patient-generated devices. Columns are the year’s care
    events. A filled circle means the stream captures the event; a hollow circle means it does
    not. Left, a 59-year-old man with diabetes and depression: most events are captured by two or
    more streams. Right, a 29-year-old woman in fertility treatment: the EHR captures nearly
    everything, but claims miss the cash-pay injectable medications and IVF procedures, and her
    daily cycle tracking exists only in an app. Illustrative.</desc>

  <!-- ===================== panel a ===================== -->
  <text x="24" y="34" font-size="15" font-weight="700" fill="#1f2328">a</text>
  <text x="44" y="34" font-size="13" font-weight="500" fill="#1f2328">59-year-old man, diabetes and depression</text>
  <text x="44" y="50" font-size="11" fill="#59636e">streams overlap and corroborate one another</text>

  <!-- column headers (rotated) -->
  <g font-size="10" fill="#59636e">
    <text transform="translate(176 150) rotate(-55)">PCP visits</text>
    <text transform="translate(216 150) rotate(-55)">A1c labs</text>
    <text transform="translate(256 150) rotate(-55)">Metformin fills</text>
    <text transform="translate(296 150) rotate(-55)">SSRI fills</text>
    <text transform="translate(336 150) rotate(-55)">PHQ-9 scores</text>
    <text transform="translate(376 150) rotate(-55)">CGM glucose</text>
    <text transform="translate(416 150) rotate(-55)">Steps &amp; sleep</text>
  </g>
  <!-- row labels -->
  <g font-size="11" fill="#1f2328" font-weight="500">
    <text x="44" y="177">Medical claims</text>
    <text x="44" y="209">Pharmacy claims</text>
    <text x="44" y="241">EHR</text>
    <text x="44" y="273">Patient-reported</text>
    <text x="44" y="305">Devices &amp; apps</text>
  </g>
  <g stroke="#d0d7de" stroke-width="0.5">
    <line x1="44" y1="188" x2="436" y2="188"/><line x1="44" y1="220" x2="436" y2="220"/>
    <line x1="44" y1="252" x2="436" y2="252"/><line x1="44" y1="284" x2="436" y2="284"/>
  </g>
  <!-- cells: filled = captured, hollow = not -->
  <g fill="#0969da">
    <!-- medical claims: PCP, A1c (as a billed test) -->
    <circle cx="172" cy="173" r="6"/><circle cx="212" cy="173" r="6"/>
    <!-- pharmacy claims: metformin, SSRI -->
    <circle cx="252" cy="205" r="6"/><circle cx="292" cy="205" r="6"/>
    <!-- EHR: PCP, A1c, PHQ-9, and the medication orders behind the fills -->
    <circle cx="172" cy="237" r="6"/><circle cx="212" cy="237" r="6"/><circle cx="252" cy="237" r="6"/><circle cx="292" cy="237" r="6"/><circle cx="332" cy="237" r="6"/>
    <!-- PROs -->
    <circle cx="332" cy="269" r="6"/>
    <!-- devices -->
    <circle cx="372" cy="301" r="6"/><circle cx="412" cy="301" r="6"/>
  </g>
  <g fill="none" stroke="#d0d7de" stroke-width="1">
    <circle cx="252" cy="173" r="6"/><circle cx="292" cy="173" r="6"/><circle cx="332" cy="173" r="6"/><circle cx="372" cy="173" r="6"/><circle cx="412" cy="173" r="6"/>
    <circle cx="172" cy="205" r="6"/><circle cx="212" cy="205" r="6"/><circle cx="332" cy="205" r="6"/><circle cx="372" cy="205" r="6"/><circle cx="412" cy="205" r="6"/>
    <circle cx="372" cy="237" r="6"/><circle cx="412" cy="237" r="6"/>
    <circle cx="172" cy="269" r="6"/><circle cx="212" cy="269" r="6"/><circle cx="252" cy="269" r="6"/><circle cx="292" cy="269" r="6"/><circle cx="372" cy="269" r="6"/><circle cx="412" cy="269" r="6"/>
    <circle cx="172" cy="301" r="6"/><circle cx="212" cy="301" r="6"/><circle cx="252" cy="301" r="6"/><circle cx="292" cy="301" r="6"/><circle cx="332" cy="301" r="6"/>
  </g>
  <text x="44" y="340" font-size="11" fill="#59636e">Every event is seen by at least one stream; most by two.</text>

  <!-- ===================== panel b ===================== -->
  <text x="470" y="34" font-size="15" font-weight="700" fill="#1f2328">b</text>
  <text x="490" y="34" font-size="13" font-weight="500" fill="#1f2328">29-year-old woman, fertility treatment</text>
  <text x="490" y="50" font-size="11" fill="#59636e">the EHR is rich; claims are blind to cash-pay care</text>

  <g font-size="10" fill="#59636e">
    <text transform="translate(622 150) rotate(-55)">Clinic visits</text>
    <text transform="translate(662 150) rotate(-55)">Hormone labs</text>
    <text transform="translate(702 150) rotate(-55)">Ultrasounds</text>
    <text transform="translate(742 150) rotate(-55)">Clomiphene</text>
    <text transform="translate(782 150) rotate(-55)">Gonadotropins (cash)</text>
    <text transform="translate(822 150) rotate(-55)">IVF cycle (cash)</text>
    <text transform="translate(862 150) rotate(-55)">Cycle tracking</text>
  </g>
  <g font-size="11" fill="#1f2328" font-weight="500">
    <text x="490" y="177">Medical claims</text>
    <text x="490" y="209">Pharmacy claims</text>
    <text x="490" y="241">EHR</text>
    <text x="490" y="273">Patient-reported</text>
    <text x="490" y="305">Devices &amp; apps</text>
  </g>
  <g stroke="#d0d7de" stroke-width="0.5">
    <line x1="490" y1="188" x2="882" y2="188"/><line x1="490" y1="220" x2="882" y2="220"/>
    <line x1="490" y1="252" x2="882" y2="252"/><line x1="490" y1="284" x2="882" y2="284"/>
  </g>
  <g fill="#0969da">
    <!-- medical claims: some visits and labs billed to insurance -->
    <circle cx="618" cy="173" r="6"/><circle cx="658" cy="173" r="6"/>
    <!-- pharmacy claims: clomiphene only -->
    <circle cx="738" cy="205" r="6"/>
    <!-- EHR: nearly everything clinical -->
    <circle cx="618" cy="237" r="6"/><circle cx="658" cy="237" r="6"/><circle cx="698" cy="237" r="6"/><circle cx="738" cy="237" r="6"/><circle cx="778" cy="237" r="6"/><circle cx="818" cy="237" r="6"/>
    <!-- devices/apps: cycle tracking -->
    <circle cx="858" cy="301" r="6"/>
  </g>
  <!-- blind spots highlighted -->
  <g fill="none" stroke="#d55e00" stroke-width="1.5">
    <circle cx="698" cy="173" r="6"/><circle cx="778" cy="173" r="6"/><circle cx="818" cy="173" r="6"/>
    <circle cx="778" cy="205" r="6"/><circle cx="818" cy="205" r="6"/>
  </g>
  <g fill="none" stroke="#d0d7de" stroke-width="1">
    <circle cx="738" cy="173" r="6"/><circle cx="858" cy="173" r="6"/>
    <circle cx="618" cy="205" r="6"/><circle cx="658" cy="205" r="6"/><circle cx="698" cy="205" r="6"/><circle cx="858" cy="205" r="6"/>
    <circle cx="858" cy="237" r="6"/>
    <circle cx="618" cy="269" r="6"/><circle cx="658" cy="269" r="6"/><circle cx="698" cy="269" r="6"/><circle cx="738" cy="269" r="6"/><circle cx="778" cy="269" r="6"/><circle cx="818" cy="269" r="6"/><circle cx="858" cy="269" r="6"/>
    <circle cx="618" cy="301" r="6"/><circle cx="658" cy="301" r="6"/><circle cx="698" cy="301" r="6"/><circle cx="738" cy="301" r="6"/><circle cx="778" cy="301" r="6"/><circle cx="818" cy="301" r="6"/>
  </g>
  <text x="490" y="340" font-size="11" fill="#59636e">Claims miss the most significant care of her year; PROs (anxiety,</text>
  <text x="490" y="354" font-size="11" fill="#59636e">depression) are collected only if the clinic administers them.</text>

  <!-- legend -->
  <g transform="translate(44 378)">
    <circle cx="6" cy="0" r="6" fill="#0969da"/>
    <text x="18" y="4" font-size="11" fill="#59636e">captured by the stream</text>
    <circle cx="176" cy="0" r="6" fill="none" stroke="#d0d7de" stroke-width="1"/>
    <text x="188" y="4" font-size="11" fill="#59636e">not captured</text>
    <circle cx="290" cy="0" r="6" fill="none" stroke="#d55e00" stroke-width="1.5"/>
    <text x="302" y="4" font-size="11" fill="#59636e">blind spot: care happened, but paid out of pocket</text>
  </g>
</svg>
