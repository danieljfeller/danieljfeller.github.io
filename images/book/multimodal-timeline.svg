  <title>Twelve months of data for one patient, one stream per track</title>
  <desc>Five stacked tracks over January to December: SSRI fills from pharmacy claims with a gap in late March through mid May, hemoglobin A1c from EHR labs falling from 8.4 to 7.6 percent, PHQ-9 scores falling from 16 to 8 with a plateau during the gap, CGM time in range rising from 52 to 68 percent, and average daily steps dipping in the spring. A shaded band marks the adherence gap across all tracks. Synthetic data.</desc>
