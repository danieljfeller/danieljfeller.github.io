<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336"
     role="img" text-rendering="geometricPrecision"
     font-family="'Inter', Arial, Helvetica, sans-serif">
  <title>Types of patient-generated data</title>
  <desc>Seven categories of patient-generated data — wearable data, self-reported
    outcomes, home monitoring devices, connected medical devices, social and
    lifestyle data, environmental data, and social network and media data — each
    listed with representative examples.</desc>

  <!-- rows: each has a colored letter, category name, and example list -->
  <!-- a -->
  <text x="40" y="60" font-size="14" font-weight="700" fill="#0969da">a</text>
  <text x="62" y="60" font-size="13" font-weight="600" fill="#1f2328">Wearable data</text>
  <g font-size="11" fill="#59636e">
    <text x="300" y="54">Fitness trackers (steps, HR, sleep) · Health-specific wearables (glucose, metrics)</text>
    <text x="300" y="70">Smart clothing (physiological markers)</text>
  </g>
  <line x1="40" y1="80" x2="860" y2="80" stroke="#d0d7de" stroke-width="0.75"/>

  <!-- b -->
  <text x="40" y="100" font-size="14" font-weight="700" fill="#0969da">b</text>
  <text x="62" y="100" font-size="13" font-weight="600" fill="#1f2328">Self-reported outcomes</text>
  <g font-size="11" fill="#59636e">
    <text x="300" y="94">Health diaries (symptoms, diet, meds) · Surveys &amp; questionnaires (PROMIS, well-being)</text>
    <text x="300" y="110">Mobile apps (mood, nutrition, pain)</text>
  </g>
  <line x1="40" y1="120" x2="860" y2="120" stroke="#d0d7de" stroke-width="0.75"/>

  <!-- c -->
  <text x="40" y="140" font-size="14" font-weight="700" fill="#0969da">c</text>
  <text x="62" y="140" font-size="13" font-weight="600" fill="#1f2328">Home monitoring devices</text>
  <g font-size="11" fill="#59636e">
    <text x="300" y="134">Blood-pressure monitors · Glucose meters · Pulse oximeters · Electronic scales (weight)</text>
    <text x="300" y="150">Smart thermometers (temperature)</text>
  </g>
  <line x1="40" y1="160" x2="860" y2="160" stroke="#d0d7de" stroke-width="0.75"/>

  <!-- d -->
  <text x="40" y="180" font-size="14" font-weight="700" fill="#0969da">d</text>
  <text x="62" y="180" font-size="13" font-weight="600" fill="#1f2328">Connected medical devices</text>
  <g font-size="11" fill="#59636e">
    <text x="300" y="174">Smart inhalers (medication use, reminders) · Digital pills (ingestion, adherence)</text>
    <text x="300" y="190">Implantable devices (cardiac data)</text>
  </g>
  <line x1="40" y1="200" x2="860" y2="200" stroke="#d0d7de" stroke-width="0.75"/>

  <!-- e -->
  <text x="40" y="220" font-size="14" font-weight="700" fill="#0969da">e</text>
  <text x="62" y="220" font-size="13" font-weight="600" fill="#1f2328">Social &amp; lifestyle data</text>
  <g font-size="11" fill="#59636e">
    <text x="300" y="214">Dietary intake (meals, snacks) · Exercise &amp; activity logs (workouts, sports)</text>
    <text x="300" y="230">Mental well-being apps (mood, stress)</text>
  </g>
  <line x1="40" y1="240" x2="860" y2="240" stroke="#d0d7de" stroke-width="0.75"/>

  <!-- f -->
  <text x="40" y="262" font-size="14" font-weight="700" fill="#0969da">f</text>
  <text x="62" y="262" font-size="13" font-weight="600" fill="#1f2328">Environmental data</text>
  <g font-size="11" fill="#59636e">
    <text x="300" y="262">Air-quality monitors (allergies, respiratory) · Home sensors (mold, pollen)</text>
  </g>
  <line x1="40" y1="278" x2="860" y2="278" stroke="#d0d7de" stroke-width="0.75"/>

  <!-- g -->
  <text x="40" y="300" font-size="14" font-weight="700" fill="#0969da">g</text>
  <text x="62" y="300" font-size="13" font-weight="600" fill="#1f2328">Social network &amp; media data</text>
  <g font-size="11" fill="#59636e">
    <text x="300" y="294">Posts &amp; interactions (emotional well-being) · Activity patterns (sleep, mental health)</text>
    <text x="300" y="310">Connection maps (social isolation) · Communication analysis (quality, health impact)</text>
  </g>
</svg>
